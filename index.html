<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="google-site-verification" content="p399rUdcNUuJI12wyyhrNzfnJKheRQHy106DN-YWJsg" />
  <meta name="6a97888e-site-verification" content="a1be0a661f577bbd2c3eb82350a10d97">
  
  <!-- SEO Meta Tags -->
  <title>MISSAV-J — Immersive JAV Streaming & Video Feed</title>
  <meta name="description" id="meta-description" content="Temukan tren video streaming terbaik dengan antarmuka YouTube-inspired dark mode premium. MISSAV-J menghadirkan navigasi single-page app super cepat.">
  <meta name="author" content="MISSAV-J">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" id="og-type" content="website">
  <meta property="og:site_name" content="MISSAV-J">
  <meta property="og:url" id="og-url" content="https://www.missav-j.web.id">
  <meta property="og:title" id="og-title" content="MISSAV-J — Premium Video Streaming Feed">
  <meta property="og:description" id="og-description" content="Aliran streaming JAV premium dengan responsif tinggi dan mode gelap default.">
  <meta property="og:image" id="og-image" content="/assets/images/logo.png">
  <meta property="og:locale" id="og-locale" content="en_US">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" id="twitter-card" content="summary_large_image">
  <meta name="twitter:title" id="twitter-title" content="MISSAV-J — Premium Video Streaming Feed">
  <meta name="twitter:description" id="twitter-description" content="Aliran streaming JAV premium dengan responsif tinggi dan mode gelap default.">
  <meta name="twitter:image" id="twitter-image" content="/assets/images/logo.png">

  <!-- JSON-LD Structured Data (dynamically updated by app.js) -->
  <script type="application/ld+json" id="json-ld-data">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "MISSAV-J",
    "url": "https://www.missav-j.web.id",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://www.missav-j.web.id/en/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Google Fonts - Roboto & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- Premium Modular Stylesheets -->
  <link rel="stylesheet" href="/assets/css/base.css?v=1.1.3">
  <link rel="stylesheet" href="/assets/css/layout.css?v=1.2.1">
  <link rel="stylesheet" href="/assets/css/components.css?v=1.1.9">
  <link rel="stylesheet" href="/assets/css/player.css?v=1.1.4">
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="header">
    <div class="header-left">
      <!-- Hamburger Menu Button -->
      <button class="menu-btn" id="menu-btn" title="Menu Utama" aria-label="Toggle Sidebar">
        ☰
      </button>
      
      <!-- Logo MISSAV-J -->
      <a href="#/" class="logo" id="logo-branding">
        <span class="logo-text">MISS<span class="logo-accent">AV-J</span></span>
      </a>
    </div>

    <!-- Centered Search Bar -->
    <div class="header-center">
      <div class="search-container">
        <input 
          type="text" 
          id="header-search-input" 
          class="search-input" 
          placeholder="Cari video, aktor, studio, kode..." 
          data-i18n-placeholder="search_placeholder"
          autocomplete="off" 
          spellcheck="false"
        >
        <button id="header-search-btn" class="search-btn" title="Cari" aria-label="Eksekusi Pencarian">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Actions & Toggles -->
    <div class="header-right">

      <!-- Dark/Light Theme Switcher -->
      <button class="header-action-btn" id="theme-toggle-btn" title="Toggle Tema">
        <!-- SVG Diisi Dinamis oleh ui.js -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
        </svg>
      </button>
      
      <!-- Flag Language Dropdown Popover (Premium circular style) -->
      <div class="lang-dropdown" id="lang-dropdown">
        <button class="lang-trigger" id="lang-dropdown-trigger" title="Change Language" aria-haspopup="true" aria-expanded="false">
          <img id="lang-trigger-flag" src="/assets/pics/united-kingdom.png" alt="English">
        </button>
        <div class="lang-menu hidden" id="lang-dropdown-menu">
          <!-- Diisi secara dinamis oleh app.js berdasarkan i18n.LANGS -->
        </div>
      </div>
    </div>
  </header>

  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Collapsible left sidebar navigation -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <!-- Rute utama -->
        <a href="#/" class="active">
          <span class="nav-icon">🏠</span>
          <span class="nav-text" data-i18n="nav_home">Beranda</span>
        </a>
        <a href="#/trending">
          <span class="nav-icon">🔥</span>
          <span class="nav-text" data-i18n="nav_trending">Populer (Trending)</span>
        </a>
        <a href="#/recent">
          <span class="nav-icon">🕐</span>
          <span class="nav-text" data-i18n="nav_recent">Terbaru</span>
        </a>
        
        <div class="sidebar-divider"></div>
        
        <!-- Section Jelajahi -->
        <div class="sidebar-section-title" data-i18n="sidebar_explore">Jelajahi</div>
        <a href="#/actors">
          <span class="nav-icon">🎭</span>
          <span class="nav-text" data-i18n="nav_all_actors">All Actors</span>
        </a>
        <a href="#/categories">
          <span class="nav-icon">📁</span>
          <span class="nav-text" data-i18n="nav_all_categories">All Categories</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- Section Koleksi Saya -->
        <div class="sidebar-section-title" data-i18n="sidebar_my_collections">Koleksi Saya</div>
        <a href="#/watch-later">
          <span class="nav-icon">📁</span>
          <span class="nav-text" data-i18n="nav_watch_later">Tonton Nanti</span>
        </a>
        <a href="#/history">
          <span class="nav-icon">🕐</span>
          <span class="nav-text" data-i18n="nav_history">Riwayat Sesi</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- Section Info Tambahan -->
        <div class="sidebar-section-title" data-i18n="sidebar_other_info">Informasi Lain</div>
        <a href="#/popular-actors">
          <span class="nav-icon">🎭</span>
          <span class="nav-text" data-i18n="nav_actors">Aktor Populer</span>
        </a>
        <a href="#/studios">
          <span class="nav-icon">🎬</span>
          <span class="nav-text" data-i18n="nav_studios">Studio Populer</span>
        </a>
      </nav>
    </aside>

    <!-- Overlay backdrop ketika mobile sidebar terbuka -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content Panel -->
    <main class="main-content" id="main-content">
      <!-- Global Top Ad Banner Placement (Ditinjau secara responsif) -->
      <div class="ad-placement global-top-ad" id="global-top-ad"></div>

      <!-- Target Area Konten Dinamis Diinjeksi oleh Router SPA -->
      <div id="app-content">
        <!-- Halaman-halaman feed / watch akan dirender secara dinamis di sini -->
      </div>
    </main>
  </div>

  <!-- Adsterra Popunder Script Placeholder -->
  <!-- PASANG SCRIPT POPUNDER ADSTERRA ANDA DI BAWAH BARIS INI -->
  <script src="https://glamournakedemployee.com/42/94/4e/42944edee184893535ddfd1e20e98e81.js"></script>

  <div id="toast-container" class="toast-container"></div>

  <!-- Modular SPA Script Bootstrap -->
  <script type="module" src="/assets/js/app.js?v=1.2.3"></script>
</body>
</html>
