<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  
  <!-- SEO Meta Tags -->
  <title>MISSAV-J — Immersive JAV Streaming & Video Feed</title>
  <meta name="description" content="Temukan tren video streaming terbaik dengan antarmuka YouTube-inspired dark mode premium. MISSAV-J menghadirkan navigasi single-page app super cepat.">
  <meta name="author" content="MISSAV-J">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MISSAV-J — Premium Video Streaming Feed">
  <meta property="og:description" content="Aliran streaming JAV premium dengan responsif tinggi dan mode gelap default.">
  <meta property="og:image" content="assets/images/logo.png">

  <!-- Google Fonts - Roboto & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- Premium Modular Stylesheets -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/player.css">
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="header">
    <div class="header-left">
      <!-- Hamburger Menu Button -->
      <button class="menu-btn" id="menu-btn" title="Menu Utama" aria-label="Toggle Sidebar">
        ☰
      </button>
      
      <!-- Logo MISSAV-J -->
      <a href="#/" class="logo" id="logo-branding">
        <span class="logo-text">MISS<span class="logo-accent">AV-J</span></span>
      </a>
    </div>

    <!-- Centered Search Bar -->
    <div class="header-center">
      <div class="search-container">
        <input 
          type="text" 
          id="header-search-input" 
          class="search-input" 
          placeholder="Cari video, aktor, studio, kode..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button id="header-search-btn" class="search-btn" title="Cari" aria-label="Eksekusi Pencarian">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Actions & Toggles -->
    <div class="header-right">
      <!-- Dark/Light Theme Switcher -->
      <button class="header-action-btn" id="theme-toggle-btn" title="Toggle Tema">
        <!-- SVG Diisi Dinamis oleh ui.js -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
        </svg>
      </button>
      
      <!-- Info Icon Button -->
      <button class="header-action-btn" id="info-btn" title="Tentang MISSAV-J" onclick="alert('MISSAV-J — Premium JAV Stream SPA\nVanilla JS + WordPress API\nDeveloped by Antigravity AI Client')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Collapsible left sidebar navigation -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <!-- Rute utama -->
        <a href="#/" class="active">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Beranda</span>
        </a>
        <a href="#/trending">
          <span class="nav-icon">🔥</span>
          <span class="nav-text">Populer (Trending)</span>
        </a>
        <a href="#/recent">
          <span class="nav-icon">🕐</span>
          <span class="nav-text">Terbaru</span>
        </a>
        
        <div class="sidebar-divider"></div>
        
        <!-- Accordion Kategori Utama -->
        <div class="sidebar-section-title">Kategori Utama</div>
        <a href="#/category?name=Uncensored">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Uncensored</span>
        </a>
        <a href="#/category?name=Amateur">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Amateur</span>
        </a>
        <a href="#/category?name=Subtitled">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Subtitled</span>
        </a>
        <a href="#/category?name=Creampie">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Creampie</span>
        </a>
        <a href="#/category?name=Cosplay">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Cosplay</span>
        </a>
        <a href="#/category?name=Mosaic">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Mosaic</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- Section Koleksi Saya -->
        <div class="sidebar-section-title">Koleksi Saya</div>
        <a href="#/watch-later">
          <span class="nav-icon">📁</span>
          <span class="nav-text">Tonton Nanti</span>
        </a>
        <a href="#/history">
          <span class="nav-icon">🕐</span>
          <span class="nav-text">Riwayat Sesi</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- Section Info Tambahan -->
        <div class="sidebar-section-title">Informasi Lain</div>
        <button onclick="window.location.hash='#/trending'" style="cursor: pointer;">
          <span class="nav-icon">🎭</span>
          <span class="nav-text">Aktor Populer</span>
        </button>
        <button onclick="window.location.hash='#/recent'" style="cursor: pointer;">
          <span class="nav-icon">🎬</span>
          <span class="nav-text">Studio Populer</span>
        </button>
      </nav>
    </aside>

    <!-- Overlay backdrop ketika mobile sidebar terbuka -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content Panel -->
    <main class="main-content" id="main-content">
      <!-- Target Area Konten Dinamis Diinjeksi oleh Router SPA -->
      <div id="app-content">
        <!-- Halaman-halaman feed / watch akan dirender secara dinamis di sini -->
      </div>
    </main>
  </div>

  <!-- Toast Container Popup -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modular SPA Script Bootstrap -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
