  </style>
  <script>
    // Skrip pelaporan tinggi otomatis ke parent (Website utama)
    let pollCount = 0;
    const reportHeight = setInterval(() => {
      pollCount++;
      const adWrapper = document.getElementById('container-21b7c6791db50dfb4cce684222b4187e');
      if (adWrapper && adWrapper.scrollHeight > 50) {
        // Mengirim pesan ke window induk agar iframe bisa auto-resize
        window.parent.postMessage({
          type: 'resizeAdIframe',
          height: adWrapper.scrollHeight + 10
        }, '*');
        if (pollCount > 10) clearInterval(reportHeight);
      }
      if (pollCount > 40) clearInterval(reportHeight);
    }, 500);
  </script>
