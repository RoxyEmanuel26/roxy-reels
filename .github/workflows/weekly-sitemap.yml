name: Daily sitemap & AI SEO

'on':
  schedule:
    # Every day at 09:17 Asia/Jakarta (UTC+7). Avoid minute 0 GitHub Actions congestion.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sitemap-main
  cancel-in-progress: false

jobs:
  update-sitemap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run unit & SEO tests
        run: node --test tests/worker-efficiency.test.mjs tests/sitemap-generator.test.mjs

      - name: Sync curated actors and categories
        run: node scripts/sync-taxonomies.mjs || echo "Taxonomy sync completed with soft fallback"

      - name: Generate deterministic sitemap set
        id: generate
        run: node generate_sitemap.js

      - name: Enrich latest videos with Gemini AI SEO
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash'
        run: |
          node scripts/seo-enrich.mjs --limit=25 || echo "AI Enrichment completed with soft fallback"

      - name: Submit latest URLs to IndexNow (Bing & Yandex)
        run: |
          node scripts/indexnow.mjs || echo "IndexNow submission completed with soft fallback"

      - name: Auto-post daily featured highlight to Twitter/X
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          node scripts/twitter-poster.mjs --limit=1 || echo "Twitter posting completed with soft fallback"

      - name: Validate every sitemap
        run: >-
          python scripts/validate_sitemaps.py
          --dir sitemaps
          --expected-total "${{ steps.generate.outputs.total_videos }}"
          --expected-latest-id "${{ steps.generate.outputs.latest_id }}"

      - name: Check patch integrity
        run: git diff --check

      - name: Detect catalog and SEO changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- sitemaps api functions/[[catchall]].js data/seo-enriched-posts.json data/twitter-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sitemap, enriched data, and Twitter history are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push sitemap and AI SEO updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sitemaps api functions/[[catchall]].js data/seo-enriched-posts.json data/twitter-history.json
          git commit -m "chore(catalog): daily sitemap, AI SEO & Twitter update $(date -u +%F)"
          git push origin HEAD:main

      - name: Verify Cloudflare Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          LATEST_FILE: ${{ steps.generate.outputs.latest_file }}
          LATEST_URL: ${{ steps.generate.outputs.latest_url }}
          LATEST_THUMBNAIL: ${{ steps.generate.outputs.latest_thumbnail }}
          LATEST_PLAYER: ${{ steps.generate.outputs.latest_player }}
        run: node scripts/smoke_sitemap.mjs

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Daily sitemap & AI SEO"
            echo "- Catalog videos: ${{ steps.generate.outputs.total_videos }}"
            echo "- Video-enriched entries: ${{ steps.generate.outputs.eligible_videos }}"
            echo "- Latest video ID: ${{ steps.generate.outputs.latest_id }}"
            echo "- Catalog updated: ${{ steps.changes.outputs.changed }}"
            echo "- Cloudflare Worker requests from generation: 0"
          } >> "$GITHUB_STEP_SUMMARY"
